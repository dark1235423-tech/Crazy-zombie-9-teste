<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crazy Zombie 9</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
button{font:inherit}

/* ESCOLHA DO MODO */
#modeScreen{
 position:fixed;inset:0;z-index:10000;background:#111;
 display:flex;align-items:center;justify-content:center;
}
#modeBox{text-align:center;color:#fff}
#modeBox h1{font-size:28px;margin:0 0 25px}
.modeBtn{
 display:block;width:260px;margin:12px auto;padding:18px;
 border:2px solid #777;border-radius:12px;background:#252525;color:#fff;
 font-size:20px;font-weight:bold;
}
.modeBtn:active{background:#555;transform:scale(.98)}

/* ÁREA DO JOGO */
#gameArea{
 position:absolute;left:50%;top:50%;
 width:940px;height:800px;
 transform:translate(-50%,-50%);
 transform-origin:center center;
}
ruffle-player{display:block;width:940px;height:800px}

/* HUD MOBILE */
#mobileHUD{
 display:none;position:fixed;inset:0;z-index:9000;
 pointer-events:none;touch-action:none;
}
#joystick{
 position:absolute;left:25px;bottom:25px;
 width:180px;height:180px;border:3px solid rgba(255,255,255,.45);
 border-radius:50%;background:rgba(0,0,0,.35);pointer-events:auto;
}
#stick{
 position:absolute;left:47px;top:47px;width:80px;height:80px;
 border-radius:50%;background:rgba(220,220,220,.75);
 border:3px solid rgba(255,255,255,.55);
}
.arrow{position:absolute;color:#fff;font-size:23px;opacity:.8}
.up{top:8px;left:73px}.down{bottom:8px;left:73px}
.left{left:8px;top:73px}.right{right:8px;top:73px}

#keyToggle{
 position:absolute;right:22px;bottom:205px;
 padding:12px 18px;border:2px solid #888;border-radius:10px;
 background:rgba(15,15,15,.85);color:#fff;font-weight:bold;
 pointer-events:auto;
}
#keys{
 display:none;position:absolute;right:20px;bottom:25px;
 width:285px;grid-template-columns:repeat(3,80px);gap:9px;
 pointer-events:auto;
}
#keys.show{display:grid}
.key{
 width:80px;height:62px;border:3px solid #aaa;border-radius:11px;
 background:linear-gradient(#fff,#d5d5d5);color:#9b0000;
 font-size:22px;font-weight:bold;box-shadow:0 4px 0 #666;
}
.key:active{transform:translateY(4px);box-shadow:0 0 0 #666}
#backBtn{
 position:absolute;right:22px;top:20px;padding:9px 14px;
 border:2px solid #888;border-radius:9px;background:rgba(0,0,0,.7);
 color:#fff;font-weight:bold;pointer-events:auto;
}

/* COMPUTADOR */
#pcBack{
 display:none;position:fixed;right:15px;top:15px;z-index:9500;
 padding:8px 12px;border-radius:8px;border:2px solid #777;
 background:#222;color:#fff;
}
body.mobile #mobileHUD{display:block}
body.mobile #pcBack{display:none}
body.desktop #pcBack{display:block}
</style>
</head>

<body>

<div id="modeScreen">
 <div id="modeBox">
  <h1>Como você quer jogar?</h1>
  <button class="modeBtn" id="mobileBtn">📱 CELULAR</button>
  <button class="modeBtn" id="desktopBtn">🖥️ COMPUTADOR</button>
 </div>
</div>

<div id="gameArea">
 <ruffle-player src="Crazy-zombie-9.0.swf" width="940" height="800"></ruffle-player>
</div>

<button id="pcBack">MENU</button>

<div id="mobileHUD">
 <button id="backBtn">MENU</button>

 <div id="joystick">
  <div class="arrow up">▲</div>
  <div class="arrow down">▼</div>
  <div class="arrow left">◀</div>
  <div class="arrow right">▶</div>
  <div id="stick"></div>
 </div>

 <button id="keyToggle">TECLAS</button>

 <div id="keys">
  <button class="key" data-key="u">U</button>
  <button class="key" data-key="i">I</button>
  <button class="key" data-key="o">O</button>
  <button class="key" data-key="j">J</button>
  <button class="key" data-key="k">K</button>
  <button class="key" data-key="l">L</button>
 </div>
</div>

<script>
const modeScreen=document.getElementById('modeScreen');
const gameArea=document.getElementById('gameArea');
const mobileHUD=document.getElementById('mobileHUD');
const keys=document.getElementById('keys');

function fitGame(){
 const w=window.innerWidth,h=window.innerHeight;
 const scale=Math.min(w/940,h/800);
 gameArea.style.transform=`translate(-50%,-50%) scale(${scale})`;
}

function desktopMode(){
 document.body.className='desktop';
 modeScreen.style.display='none';
 mobileHUD.style.display='none';
 gameArea.style.transform='translate(-50%,-50%)';
}

function mobileMode(){
 document.body.className='mobile';
 modeScreen.style.display='none';
 mobileHUD.style.display='block';
 fitGame();
}

document.getElementById('mobileBtn').onclick=mobileMode;
document.getElementById('desktopBtn').onclick=desktopMode;

document.getElementById('pcBack').onclick=()=>{
 modeScreen.style.display='flex';
};

document.getElementById('backBtn').onclick=()=>{
 keys.classList.remove('show');
 modeScreen.style.display='flex';
};

window.addEventListener('resize',()=>{
 if(document.body.classList.contains('mobile')) fitGame();
});

/* TECLAS */
function keyDown(k){
 const e=new KeyboardEvent('keydown',{
  key:k,code:'Key'+k.toUpperCase(),bubbles:true,cancelable:true
 });
 window.dispatchEvent(e);
}
function keyUp(k){
 const e=new KeyboardEvent('keyup',{
  key:k,code:'Key'+k.toUpperCase(),bubbles:true,cancelable:true
 });
 window.dispatchEvent(e);
}

document.getElementById('keyToggle').onclick=()=>{
 keys.classList.toggle('show');
 document.getElementById('keyToggle').textContent=
   keys.classList.contains('show')?'ESCONDER':'TECLAS';
};

document.querySelectorAll('.key').forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener('touchstart',e=>{e.preventDefault();keyDown(k)},{passive:false});
 btn.addEventListener('touchend',e=>{e.preventDefault();keyUp(k)},{passive:false});
 btn.addEventListener('touchcancel',()=>keyUp(k));
 btn.addEventListener('mousedown',()=>keyDown(k));
 btn.addEventListener('mouseup',()=>keyUp(k));
});

/* JOYSTICK */
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyKeys=[];

function releaseJoy(){
 joyKeys.forEach(keyUp);
 joyKeys=[];
 stick.style.left='47px';
 stick.style.top='47px';
}

function moveJoy(x,y){
 const r=joystick.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=x-cx,dy=y-cy;
 const d=Math.hypot(dx,dy),max=52;
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 stick.style.left=(47+dx)+'px';
 stick.style.top=(47+dy)+'px';

 let n=[];
 if(dx<-22)n.push('a');
 if(dx>22)n.push('d');
 if(dy<-22)n.push('w');
 if(dy>22)n.push('s');

 joyKeys.filter(k=>!n.includes(k)).forEach(keyUp);
 n.filter(k=>!joyKeys.includes(k)).forEach(keyDown);
 joyKeys=n;
}

joystick.addEventListener('touchstart',e=>{
 e.preventDefault();let t=e.touches[0];moveJoy(t.clientX,t.clientY);
},{passive:false});
joystick.addEventListener('touchmove',e=>{
 e.preventDefault();let t=e.touches[0];moveJoy(t.clientX,t.clientY);
},{passive:false});
joystick.addEventListener('touchend',e=>{e.preventDefault();releaseJoy()},{passive:false});
joystick.addEventListener('touchcancel',releaseJoy);
</script>
</body>
</html>
